<main class="centered-main">
      <section class="centered-section cases full-width-section">
      <h1 class="centered-text">Trabajos realizados</h1>
      <ul class="cases-grid">
        @for(case of cases; track $index; let i = $index) {
<li class="case-container" 
       >
        <button
        type="button"
        class="case-image-button"
        [attr.aria-label]="'Ampliar imagen: ' + (case.url | alt)"
        (click)="selectCase(i)">

       <img class="case-image" [src]="case.url" [alt]="case.url | alt">
          </button>
      </li>
        }
      </ul>  
      @if(selectedCase) {
<figure class="image-zoom-container" role="dialog" aria-modal="true">
        <img 
      loading="lazy" decoding="async" class="case-image-zoom blue-shadow" [src]="selectedCase" [alt]="selectedCase | alt">
      <button type="button"
      aria-label="Cerrar imagen" class="button xmark" (click)="closeImageZoom()"
      >X</button>
        
</figure>
      }
    </section>
     <app-keywords-animation></app-keywords-animation>
  </main>
