<header>

<div class="secondary-header">
  <p>
    <span class="secondary-header-claim">SOMOS FABRICANTES · </span>
    <span class="secondary-header-claim">100% PERSONALIZADO</span>   
  </p>
</div>

   
    <div class="main-header">
     
    <button type="button" [attr.aria-label]="burguerIsOpen ? 'Cerrar menú de navegación': 'Abrir menú de navegación'" 
    [attr.aria-expanded]="burguerIsOpen"
     aria-controls="header-navbar"
    class="burguer" (click)="openBurguer()">{{burguerIsOpen ? 'X': '☰'}}</button>
    
    <a class="logo" [routerLink]="['/']" aria-label="Ir a la página de inicio"
      ><img
        class="header-logo"
        src="/rotulos-learoy-logo.webp"
        alt="Rótulos Learoy"
          loading="lazy"
   decoding="async"
   width="178"
  height="64"
    /></a>
    <app-search-input></app-search-input>
    <ul class="contact-buttons">
      
      <li><a class="call-button" aria-label="Llamar por teléfono" [href]="'tel:+34'+contactDetails.phone">
<app-icon [iconPath]="phonePath" [ngClass]="'small-icon green'"></app-icon>
     
      </a>
      <li><a class="contact-button" aria-label="Ir a formulario de contacto" [routerLink]="['/contacto']">
<app-icon [iconPath]="envelopePath" [ngClass]="'small-icon fuchsia'"></app-icon>
              </a></li>

              <li><a class="contact-button" aria-label="Ir al carrito" [routerLink]="['/cart']">
<app-icon [iconPath]="cartPath" [ngClass]="'small-icon blue'"></app-icon>
              </a></li>
   
  
  </ul>
</div>
  <app-navbar 
    [ngClass]="{ 'header-navbar': true, active: burguerIsOpen }"
    [burguerIsOpen]="burguerIsOpen" (burguerIsClose)="onBurguerStateChanged($event)" 
    (showSubmenu)="showSubmenu()" 
    (hideSubmenu)="hideSubmenu()" 
    ></app-navbar>


  <!-- <app-submenu [submenuVisible]="submenuVisible" (mouseleave)="hideSubmenu()"></app-submenu> -->
  </header>
