 <button type="button" class="arrow-button" aria-label="Logotipo anterior" (click)="carouselPrevElements()">
  <app-icon 
  [ngClass]="'small-icon blue'" [iconPath]="leftArrow"></app-icon>
  </button>


<ul class="logos-list">
      @for(logo of customerLogos; track $index; let i = $index) {
    <li>
        <img [ngSrc]="
            '/logos/'+ logo
            " alt="logo">
    </li>
        }
</ul>

  <button type="button" class="arrow-button" aria-label="Producto siguiente" (click)="carouselNextElements()">
  <app-icon [ngClass]="'small-icon blue'"  [iconPath]="rightArrow" ></app-icon>
  </button>
