 <h2 _ngcontent-ng-c3809309318="" class="small-title centered-text">Clientes que han confiado en nosotros</h2>
 
 <div class="custmers-container"
    >
  <button type="button" class="arrow-button" aria-label="Logotipo anterior" (click)="carouselPrevElements()">
  <app-icon 
  [ngClass]="'small-icon blue arrow-customer'" [iconPath]="leftArrow"></app-icon>
  </button>


 <ul class="logos-list"
     [class.moving]="isMoving"
    [style.transform]="isMoving ? 'translateX(-20%)' : 'translateX(0)'">
      @for(logo of customerLogosShown; track $index; let i = $index) {
    <li class="carousel-item">
        <img class="customer-logo" [src]="
            '/logos/'+ logo + '.png'
            " alt="logo">
    </li>
        }
</ul>

  <button type="button" class="arrow-button" aria-label="Producto siguiente" (click)="carouselNextElements()">
  <app-icon [ngClass]="'small-icon blue arrow-customer'"  [iconPath]="rightArrow" ></app-icon>
  </button>
</div>
