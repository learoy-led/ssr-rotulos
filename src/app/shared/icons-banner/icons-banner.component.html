<div class="image-container">
<img src="https://res.cloudinary.com/dxuseyfxa/image/upload/f_auto,q_auto/v1786527652/neon-entrega-rotulos-learoy_mvsm6a.jpg" class="banner-image"

  loading="lazy"
   decoding="async"
  >
</div>

<div class="text-container">
<p class="small-title">{{ title }} </p>
<p class="text">{{ description }}</p>
<ul class="icons-container">
   @for(icon of icons; track icon.path) {
 <li class="icon-container">
   

    <svg xmlns="http://www.w3.org/2000/svg"  aria-hidden="true" focusable="false" class="icon-embalaje"
  viewBox="0 0 640 640">
    <!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
              <path [attr.d]="icon.path"/>
            </svg>

    <p class="text-icon">{{ icon.text }}</p>
</li> 
}
</ul>
</div>
